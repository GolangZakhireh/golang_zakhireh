<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GolangZakhireh | Module Proxy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #000000;
        --card-bg: #000000;
        --border-color: #30363d;
        --text-primary: #ffffff;
        --text-secondary: #8b949e;
        --accent: #ffffff;
        --accent-dim: rgba(255, 255, 255, 0.1);
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Helvetica,
          Arial,
          sans-serif;
        margin: 0;
        padding: 0;
        line-height: 1.5;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 40px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border-color);
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        margin: 0;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .badge {
        background: var(--accent);
        color: #000;
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 12px;
        font-weight: 700;
      }
      input[type="text"] {
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        color: #ffffff;
        padding: 10px 16px;
        border-radius: 6px;
        width: 300px;
        font-size: 14px;
        font-family: inherit;
      }
      input[type="text"]:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-dim);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--bg-color);
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid var(--border-color);
      }
      th {
        text-align: left;
        padding: 16px;
        background: var(--bg-color);
        color: var(--text-primary);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-bottom: 1px solid var(--border-color);
      }
      td {
        padding: 16px;
        border-bottom: 1px solid var(--border-color);
        font-size: 14px;
      }
      th:first-child {
        border-top-left-radius: 6px;
      }
      th:last-child {
        border-top-right-radius: 6px;
      }
      td:first-child {
        border-bottom-left-radius: 6px;
      }
      td:last-child {
        border-bottom-right-radius: 6px;
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr:hover {
        background-color: rgba(255, 255, 255, 0.02);
      }
      .module-path {
        font-family: "JetBrains Mono", monospace;
        color: var(--accent);
        font-weight: 500;
      }
      .versions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tag {
        background: rgba(110, 118, 129, 0.4);
        color: #f0f6fc;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 12px;
        font-family: "JetBrains Mono", monospace;
      }
      .meta {
        color: var(--text-secondary);
        font-size: 13px;
      }
      .empty-state {
        text-align: center;
        padding: 60px;
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>GolangZakhireh</h1>
        <input
          type="text"
          id="search"
          placeholder="Search modules..."
          onkeyup="filterModules()"
        />
      </header>

      <div id="module-list">
        {{if .}}
        <table>
          <thead>
            <tr>
              <th width="40%">Module</th>
              <th width="35%">Versions</th>
              <th width="10%">Size</th>
              <th width="15%">Last Updated</th>
            </tr>
          </thead>
          <tbody>
            {{range .}}
            <tr class="module-row">
              <td><div class="module-path">{{.Path}}</div></td>
              <td>
                <div class="versions">
                  {{range .Versions}}<span class="tag">{{.}}</span>{{end}}
                </div>
              </td>
              <td class="meta">{{humanBytes .Size}}</td>
              <td class="meta">{{.UpdatedAt.Format "2006-01-02 15:04"}}</td>
            </tr>
            {{end}}
          </tbody>
        </table>
        {{else}}
        <div class="empty-state">
          <p>No modules cached yet.</p>
          <p style="font-size: 12px; margin-top: 10px">
            Run <code>go get</code> or <code>go mod download</code> to populate
            the cache.
          </p>
        </div>
        {{end}}
      </div>
    </div>

    <script>
      function filterModules() {
        const input = document.getElementById("search");
        const filter = input.value.toLowerCase();
        const rows = document.getElementsByClassName("module-row");

        for (let i = 0; i < rows.length; i++) {
          const path = rows[i].querySelector(".module-path").textContent;
          if (path.toLowerCase().indexOf(filter) > -1) {
            rows[i].style.display = "";
          } else {
            rows[i].style.display = "none";
          }
        }
      }

      // Focus search input on Ctrl+F
      document.addEventListener("keydown", function (e) {
        if (e.ctrlKey && (e.key === "f" || e.key === "F")) {
          e.preventDefault();
          const searchBox = document.getElementById("search");
          if (searchBox) {
            searchBox.focus();
            searchBox.select();
          }
        }
      });
    </script>
  </body>
</html>
